<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>New password</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f7fb; color: #1d2433; margin: 0; padding: 24px 16px; }
  main { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p, label { font-size: 17px; line-height: 1.5; }
  input { display: block; width: 100%; box-sizing: border-box; font-size: 17px; padding: 10px; margin: 4px 0 14px; border: 1px solid #9aa4b5; border-radius: 8px; }
  button { font-size: 17px; padding: 12px 20px; border: 0; border-radius: 10px; background: #3b6fd8; color: #fff; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <form id="form">
    <label for="p1">New password (at least 8 characters)</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Type it again</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Save password</button>
  </form>
  <p id="msg"></p>
</main>
<script>
(function () {
  var form = document.getElementById("form");
  var msg = document.getElementById("msg");
  var token = new URLSearchParams(location.search).get("token");
  function show(text, bad) { msg.textContent = text; msg.className = bad ? "err" : ""; }
  if (!token) { form.hidden = true; show("This link is missing its code. Open the link from the email again.", true); return; }
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
    if (p1.length < 8) { show("Use at least 8 characters.", true); return; }
    if (p1 !== p2) { show("The two passwords are different.", true); return; }
    fetch("/api/collections/users/confirm-password-reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, password: p1, passwordConfirm: p2 })
    }).then(function (r) {
      if (r.ok) { form.hidden = true; show("Done. Go back to the app and sign in."); }
      else show("This link has expired or was already used. Ask the app for a new one.", true);
    }, function () { show("Can't reach the server. Check the internet and try again.", true); });
  });
})();
</script>
</body>
</html>
