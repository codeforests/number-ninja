name: Deploy server

# FEAT-12 (ADR-08): deploys server/ to the droplet. Manual only.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
# PB_SUPERUSER_EMAIL, PB_SUPERUSER_PASSWORD, optional CERT_EMAIL.
# Optional (FEAT-13): SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD,
# MAIL_SENDER_ADDRESS, RESEND_API_KEY (email over HTTPS; wins over SMTP),
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET. Optional (FEAT-24): CRASH_DIGEST_TO.
# Optional (FEAT-29, set in FEAT-35): BILLING_WEBHOOK_SECRET (empty = webhook off).
# Variables: SERVER_HOSTNAME, optional SERVER_LEGACY_HOSTNAME (FEAT-20). Steps: server/README.md.
on:
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: SSH key and known host
        env:
          SSH_KEY_CONTENT: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY_CONTENT" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: /home/runner/.ssh/deploy_key
          SSH_KNOWN_HOSTS: /home/runner/.ssh/known_hosts
          SERVER_HOSTNAME: ${{ vars.SERVER_HOSTNAME }}
          SERVER_LEGACY_HOSTNAME: ${{ vars.SERVER_LEGACY_HOSTNAME }}
          PB_SUPERUSER_EMAIL: ${{ secrets.PB_SUPERUSER_EMAIL }}
          PB_SUPERUSER_PASSWORD: ${{ secrets.PB_SUPERUSER_PASSWORD }}
          CERT_EMAIL: ${{ secrets.CERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_SENDER_ADDRESS: ${{ secrets.MAIL_SENDER_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CRASH_DIGEST_TO: ${{ secrets.CRASH_DIGEST_TO }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
        run: server/deploy.sh

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
