name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: SQLite for Drift tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Question bank is up to date (BNK-04)
        run: |
          dart run tool/generate_bank.dart
          git diff --exit-code assets/

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK is signed with this runner's debug key and will not install over an earlier APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=number-ninja"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Check release manifest (NFR-01, NFR-06)
        run: |
          set -euo pipefail
          m=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $m"
          if grep -q 'android.permission.INTERNET' "$m"; then
            echo "::error::Release manifest requests INTERNET"; exit 1
          fi
          grep -o 'android:minSdkVersion="[0-9]*"' "$m"
          grep -q 'android:minSdkVersion="24"' "$m"
          grep -o 'android.permission.[A-Z_]*' "$m" | sort -u || echo "No permissions"

      - uses: actions/upload-artifact@v4
        with:
          name: number-ninja-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
