name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Milestone release tag, e.g. m1 (empty: build only)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    # FEAT-12: a real PocketBase proves the API rules (NFR-13) and a backup
    # restore (NFR-15). The server is set up only from server/ (NFR-15).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Shellcheck
        run: shellcheck server/*.sh server/test/run.sh scripts/server-local.sh

      - name: Format and analyze server tests
        working-directory: server/test
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos

      - name: API rules and backup restore against the pinned PocketBase
        run: server/test/run.sh

      - name: nginx -t on the rendered site file (stock Ubuntu nginx)
        run: |
          host=api.example.test
          legacy=api.old.example.test
          sudo apt-get update -q && sudo apt-get install -y -q nginx
          nginx -v
          sudo mkdir -p "/etc/letsencrypt/live/$host"
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=$host" \
            -keyout "/etc/letsencrypt/live/$host/privkey.pem" \
            -out "/etc/letsencrypt/live/$host/fullchain.pem"
          site=/etc/nginx/sites-available/numberninja.conf
          sudo ln -sf "$site" /etc/nginx/sites-enabled/numberninja.conf
          # Same render as install.sh: without, then with a legacy host (FEAT-20).
          SERVER_HOSTNAME=$host server/nginx/render.sh | sudo tee "$site" >/dev/null
          ! grep -q 'LEGACY' "$site"
          sudo nginx -t
          SERVER_HOSTNAME=$host SERVER_LEGACY_HOSTNAME=$legacy server/nginx/render.sh | sudo tee "$site" >/dev/null
          sudo nginx -t
          # The return page opens brainbubblz:// on the host, numberninja:// on the legacy host.
          sudo systemctl restart nginx
          page() { curl -sk --resolve "$1:443:127.0.0.1" "https://$1/signin/google"; }
          page "$host" | grep -q 'href="brainbubblz://signin/google"'
          page "$legacy" | grep -q 'href="numberninja://signin/google"'

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Android lint calls List.removeLast (JDK 21); see code-map Gotchas

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: SQLite for Drift tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Question bank is up to date (BNK-04)
        run: |
          dart run tool/generate_bank.dart
          git diff --exit-code assets/

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK is signed with this runner's debug key and will not install over an earlier APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=number-ninja"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        env:
          SERVER_HOSTNAME: ${{ vars.SERVER_HOSTNAME }}
        run: |
          # FEAT-12 (ADR-02): the server URL is baked in; empty = offline only.
          if [ -n "$SERVER_HOSTNAME" ]; then
            flutter build apk --release --dart-define=SERVER_URL="https://$SERVER_HOSTNAME"
          else
            flutter build apk --release
          fi

      - name: Check release manifest (NFR-01, NFR-06, NFR-11, NFR-12)
        run: |
          set -euo pipefail
          m=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $m"
          grep -o 'android:minSdkVersion="[0-9]*"' "$m"
          grep -q 'android:minSdkVersion="24"' "$m"
          # Requested permissions only (<uses-permission>); a receiver's
          # android:permission="...DUMP" (androidx profileinstaller) is a guard, not a request.
          # Joined to one line first: the merged manifest puts each attribute of a
          # multi-attribute element on its own line.
          perms=$(tr '\n' ' ' < "$m" | grep -oE '<uses-permission[^>]*android:name="android\.permission\.[A-Z_]+"' | grep -oE 'android\.permission\.[A-Z_]+' | sort -u)
          echo "Permissions: $perms"
          # FEAT-12: INTERNET (optional sync server) is the only permission.
          if [ "$perms" != "android.permission.INTERNET" ]; then
            echo "::error::Release permissions must be exactly INTERNET, got: $perms"; exit 1
          fi
          grep -q 'android:usesCleartextTraffic="false"' "$m" || { echo "::error::usesCleartextTraffic is not false"; exit 1; }
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' "$m" || { echo "::error::no network security config"; exit 1; }
          grep -q 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml

      - uses: actions/upload-artifact@v4
        with:
          name: brainbubblz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Milestone release (APK for Ken's device check)
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "brainbubblz-$TAG.apk"
          gh release create "$TAG" "brainbubblz-$TAG.apk" \
            --target "$GITHUB_SHA" --title "BrainBubblz $TAG" \
            --notes "Release-signed APK from $GITHUB_SHA for the milestone check on the tablet. Open this page on the tablet, download the APK and install it."
